name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.3). Leave empty for next patch after the latest tag (or v0.1.3 if none)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            LATEST="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
            if [ -z "${LATEST}" ]; then
              VERSION="v0.1.3"
            else
              VERSION="$(LATEST="${LATEST}" python3 - <<'PY'
          import os, re
          latest = os.environ["LATEST"]
          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", latest)
          if not m:
              raise SystemExit(f"unsupported tag: {latest}")
          major, minor, patch = map(int, m.groups())
          print(f"v{major}.{minor}.{patch + 1}")
          PY
          )"
            fi
          fi
          case "${VERSION}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "version must look like vX.Y.Z, got: ${VERSION}" >&2
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Extract changelog notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          VERSION="${VERSION}" NOTES_FILE="${NOTES_FILE}" python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          m = re.search(pattern, text)
          body = m.group(1).strip() if m else f"Release {version}."
          pathlib.Path(os.environ["NOTES_FILE"]).write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
            exit 0
          fi
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
